name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        libcint_ref: ['v6.1.3']
    env:
      REF: 'latest'

    steps:
      - uses: actions/checkout@v2
      - name: Set up GCC
        uses: egor-tensin/setup-gcc@v1
        with:
          version: latest
      - name: Set up clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
      - name: Install other dependencies
        run: |
          sudo apt-get -y install clisp meson ninja-build cmake
      - name: Generate
        run: |
           ./generate.sh "${{ matrix.libcint_ref }}" "${{ env.REF }}"
      - name: Test archive (GCC)
        run: |
            export CC=gcc
            ./tests.sh
      - name: Test archive (Clang)
        run: |
            export CC=clang
            ./tests.sh
