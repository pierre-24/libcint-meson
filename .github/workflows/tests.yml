name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  tests-gcc-and-clang:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        libcint_ref: ['v6.1.3']
    env:
      REF: 'latest'

    steps:
      - uses: actions/checkout@v4
      - name: Set up GCC
        uses: egor-tensin/setup-gcc@v1
        with:
          version: latest
      - name: Set up clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
      - name: Install other dependencies
        run: |
          sudo apt-get -y install clisp meson ninja-build cmake
      - name: Generate
        run: |
           ./generate.sh "${{ matrix.libcint_ref }}" "${{ env.REF }}"
      - name: Test archive (GCC)
        run: |
            export CC=gcc
            ./tests.sh
      - name: Test archive (Clang)
        run: |
            export CC=clang
            ./tests.sh
  
  tests-intel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        libcint_ref: ['v6.1.3']
    env:
      REF: 'latest'

    steps:
      - uses: actions/checkout@v4
      - name: Install oneAPI tools
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt update
          sudo apt install intel-oneapi-mkl-devel intel-basekit intel-hpckit intel-oneapi-compiler-fortran
      - name: Install other dependencies
        run: |
          sudo apt-get -y install clisp meson ninja-build cmake
      - name: Set up OneAPI environment
        run: |
          source /opt/intel/oneapi/setvars.sh
          printenv >> $GITHUB_ENV
          echo "FC=ifx" >> $GITHUB_ENV
          echo "CC=icx" >> $GITHUB_ENV
      - name: Generate
        run: |
           ./generate.sh "${{ matrix.libcint_ref }}" "${{ env.REF }}"
      - name: Test archive
        run: |
            ./tests.sh
